<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Malegaon Voter List Search (2002)</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body { font-family: Arial; background:#f4f6f9; text-align:center; margin:0; }
    h1 { color:#c7360a; }
    #search { width:50%; padding:10px; font-size:16px; }
    button { padding:10px; cursor:pointer; }
    .result-card { background:white; width:60%; margin:10px auto; padding:10px; }
    .hidden { display:none; }
  </style>
</head>

<body>

<h1>Malegaon Voter List Search (2002)</h1>

<!-- LOGIN -->
<div id="loginBox">
  <input id="username" placeholder="Username"><br>
  <input id="password" type="password" placeholder="Password"><br>
  <button onclick="doLogin()">Login</button>
  <div id="loginError" style="color:red;"></div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <button onclick="logout()">Logout</button><br><br>
  <input id="search" placeholder="Search..." disabled>
  <button onclick="searchVoter()" id="searchBtn" disabled>Search</button>

  <div id="loading">Loading data...</div>
  <div id="count"></div>
  <div id="results"></div>
</div>

<script>
/* LOGIN */
const USER="user52";
const PASS="Islam@5252";

if(sessionStorage.getItem("auth")) showApp();

function doLogin(){
  if(
    username.value===USER &&
    password.value===PASS
  ){
    sessionStorage.setItem("auth","true");
    showApp();
  }else{
    loginError.innerText="Invalid login";
  }
}

function showApp(){
  loginBox.classList.add("hidden");
  app.classList.remove("hidden");
}

function logout(){
  sessionStorage.clear();
  location.reload();
}

/* DATA LOAD (LOCAL FILES) */
const dataFolder = "./data/";
let voters=[];
let filtered=[];
let page=1;
const perPage=50;

async function loadData(){
  try{
    const files = await fetch(dataFolder+"files.json").then(r=>r.json());

    let total=0;

    for(const file of files){
      const res = await fetch(dataFolder+file);
      const data = await res.json();
      voters = voters.concat(data);

      total += data.length;
      loading.innerText = "Loading... "+total+" records";
    }

    loading.innerText="Loaded "+voters.length+" records";
    search.disabled=false;
    searchBtn.disabled=false;

  }catch(e){
    loading.innerText="Error loading data";
  }
}
loadData();

/* SEARCH */
function searchVoter(){
  const q = search.value.toLowerCase();
  if(!q) return;

  filtered = voters.filter(v =>
    JSON.stringify(v).toLowerCase().includes(q)
  );

  page=1;
  render();
}

function render(){
  const start=(page-1)*perPage;
  const end=start+perPage;

  count.innerText = `Showing ${start+1}-${Math.min(end,filtered.length)} of ${filtered.length}`;

  results.innerHTML="";

  filtered.slice(start,end).forEach(v=>{
    results.innerHTML += `
      <div class="result-card">
        <b>${v.name}</b><br/>
        ${v.address}<br/>
        Age: ${v.age || "-"}
      </div>
    `;
  });

  let nav="";
  if(page>1) nav+=`<button onclick="prev()">Prev</button>`;
  if(end<filtered.length) nav+=`<button onclick="next()">Next</button>`;

  results.innerHTML += nav;
}

function next(){ page++; render(); }
function prev(){ page--; render(); }

/* ENTER KEY */
search.addEventListener("keypress", e=>{
  if(e.key==="Enter") searchVoter();
});
</script>

</body>
</html>
